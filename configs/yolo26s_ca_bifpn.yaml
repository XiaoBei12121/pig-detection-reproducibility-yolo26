# YOLO26s + CA + BiFPN —— E4 实验配置
# 合并 E1（C2PSA 后置 CoordAtt）与 E2（P4/P5 BiFPNAdd 加权融合）：
#   - backbone 末端 C2PSA(10) → CoordAtt(11)
#   - P5 融合点使用 CA 输出（index 11），P4/P5 融合均为 BiFPNAdd
#   - 下采样 Conv 通道已对齐（宽度缩放后自动匹配）

# Parameters
nc: 80 # number of classes（训练时被 pig.yaml 的 nc=1 覆盖）
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, CoordAtt, [1024]] # 11 CA after C2PSA

# YOLO26n head (CA 后置 C2PSA + BiFPN 加权融合)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [512, 3, 2]] # 18: downsample P3 -> align with head P4 ch
  - [[-1, 14], 1, BiFPNAdd, [512]] # 19: weighted fusion (P4)
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [1024, 3, 2]] # 21: downsample P4 -> align with CA ch
  - [[-1, 11], 1, BiFPNAdd, [1024]] # 22: weighted fusion (P5, CA 输出)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)
