# E6: YOLO26s with the SIoU bounding-box regression loss — structure identical to configs/yolo26s_ca_bifpn.yaml.
#
# IMPORTANT: SIoU does not change the network topology. It only replaces the bounding-box
# regression term at training time and is enabled through the environment variable:
#     YOLO_SIOU=1
# Classification loss, label assignment and all other training logic stay unchanged, and no
# additional trainable parameters are introduced. See modules/README.md for the exact code path.
# This explicit config exists so that every run in manifests/ maps to a complete config file.

# YOLO26s + CA + BiFPN 鈥斺€?E4 瀹為獙閰嶇疆
# 鍚堝苟 E1锛圕2PSA 鍚庣疆 CoordAtt锛変笌 E2锛圥4/P5 BiFPNAdd 鍔犳潈铻嶅悎锛夛細
#   - backbone 鏈 C2PSA(10) 鈫?CoordAtt(11)
#   - P5 铻嶅悎鐐逛娇鐢?CA 杈撳嚭锛坕ndex 11锛夛紝P4/P5 铻嶅悎鍧囦负 BiFPNAdd
#   - 涓嬮噰鏍?Conv 閫氶亾宸插榻愶紙瀹藉害缂╂斁鍚庤嚜鍔ㄥ尮閰嶏級

# Parameters
nc: 80 # number of classes锛堣缁冩椂琚?pig.yaml 鐨?nc=1 瑕嗙洊锛?end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10
  - [-1, 1, CoordAtt, [1024]] # 11 CA after C2PSA

# YOLO26n head (CA 鍚庣疆 C2PSA + BiFPN 鍔犳潈铻嶅悎)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [512, 3, 2]] # 18: downsample P3 -> align with head P4 ch
  - [[-1, 14], 1, BiFPNAdd, [512]] # 19: weighted fusion (P4)
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [-1, 1, Conv, [1024, 3, 2]] # 21: downsample P4 -> align with CA ch
  - [[-1, 11], 1, BiFPNAdd, [1024]] # 22: weighted fusion (P5, CA 杈撳嚭)
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)

